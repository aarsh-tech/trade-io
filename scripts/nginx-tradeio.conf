# ==============================================================================
# Tradeio.site Production Nginx Reverse Proxy Configuration
# High-Availability, SSL/TLS, and WebSocket-Hardened Setup
# ==============================================================================

# Upstream Backend (NestJS Auth & Algo Engine)
upstream algo_backend {
    server 127.0.0.1:3002;
    keepalive 64;
}

# Upstream Frontend (Next.js App)
upstream algo_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── HTTP -> HTTPS Redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name tradeio.site www.tradeio.site;

    # Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tradeio.site www.tradeio.site;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tradeio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tradeio.site/privkey.pem;

    # SSL Hardening Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    # Maximum client upload limit (charts, reports)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── 1. Backend REST API Routing (/v1/) ────────────────────────────────────
    location /v1/ {
        proxy_pass http://algo_backend/v1/;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long-Running Operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # ── 2. Block Documentation / Swagger in Production ───────────────────────
    location /docs {
        return 404;
    }

    # ── 3. WebSocket Real-Time Feeds (/socket.io/) ────────────────────────────
    # Essential: Hardened for Market Ticks & Strategy Execution Streams
    location /socket.io/ {
        proxy_pass http://algo_backend/socket.io/;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers (Mandatory)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent socket disconnects during market hours (9:15 AM - 3:30 PM IST)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering for zero-latency tick updates
        proxy_buffering off;
    }

    # ── 4. Next.js Frontend Application (/) ───────────────────────────────────
    location / {
        proxy_pass http://algo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Next.js HMR (if in dev/staging)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
